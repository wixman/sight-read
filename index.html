<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sight Read">
<meta name="theme-color" content="#0d0d0d">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="manifest" href="./manifest.json">
<title>Sight Read</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap">
<link rel="stylesheet" href="./styles.css?v=3">
</head>
<body>

<!-- ============ Home ============ -->
<main id="home" class="screen">
  <header class="top">
    <button class="pill" id="soundBtn" aria-label="Key sounds">🔇</button>
  </header>
  <h1 class="title"><span>SIGHT</span><span>READ</span></h1>
  <p class="tag">Read it once. Play it on the keys. Follow the pulse.</p>
  <div class="stats" id="stats"></div>

  <section class="card">
    <div class="cardhead"><span class="lbl">LEVEL</span><span class="lvname" id="lvName"></span></div>
    <div class="stepper">
      <button class="step" id="lvDown" aria-label="Easier level">−</button>
      <div class="val"><b id="lvNum">1</b><small>OF 10</small></div>
      <button class="step" id="lvUp" aria-label="Harder level">+</button>
    </div>
    <div class="ladder" id="ladder" aria-hidden="true"></div>
  </section>

  <section class="card">
    <div class="cardhead"><span class="lbl">TEMPO</span><button class="link" id="bpmReset" hidden>LEVEL DEFAULT</button></div>
    <div class="stepper">
      <button class="step" id="bpmDown" aria-label="Slower">−</button>
      <div class="val"><b><span class="q">♩</span> = <span id="bpmNum">60</span></b><small id="bpmHint">BEATS PER MINUTE</small></div>
      <button class="step" id="bpmUp" aria-label="Faster">+</button>
    </div>
  </section>

  <section class="card opts">
    <div class="cardhead"><span class="lbl">PULSE</span></div>
    <div class="opt"><span>Count-in</span>
      <div class="seg" id="countSeg" role="radiogroup" aria-label="Count-in bars"><button data-v="1">1 bar</button><button data-v="2">2 bars</button></div></div>
    <label class="opt"><span>Fade bars once they're played<small>Keeps your eyes moving forward</small></span><input type="checkbox" id="optFade"><i class="sw"></i></label>
    <label class="opt"><span>Flash the edges on each beat<small>For your peripheral vision</small></span><input type="checkbox" id="optEdge"><i class="sw"></i></label>
    <label class="opt" id="vibRow"><span>Buzz on each beat<small>On phones that support it</small></span><input type="checkbox" id="optVib"><i class="sw"></i></label>
    <label class="opt"><span>Click on each beat<small>Off by default</small></span><input type="checkbox" id="optClick"><i class="sw"></i></label>
  </section>

  <p class="suggest" id="suggest" hidden></p>
  <button class="go" id="newRead">NEW READ</button>
</main>

<!-- ============ Reading ============ -->
<main id="read" class="screen" hidden>
  <header class="rtop">
    <button class="pill" id="backBtn">QUIT</button>
    <button class="pill icon" id="restartBtn" aria-label="Start over">↻</button>
    <div class="beats" id="beats" aria-hidden="true"></div>
    <div class="score" id="liveScore">—</div>
  </header>
  <div class="rsub"><b id="rTitle"></b> <span id="rSub"></span></div>

  <div class="paper" id="paper">
    <div class="stage" id="stage">
      <div id="osmd"></div>
      <div class="layer" id="layer"></div>
      <div class="band" id="band"></div>
      <div class="cur" id="cur"><i></i></div>
    </div>
    <div class="msg" id="msg">Drawing the music…</div>
  </div>

  <div class="kbzone" id="kbzone">
    <div class="prompt" id="prompt">Scan it first, then press START</div>
    <div class="kbs" id="kbs"></div>
    <button class="go startbtn" id="goBtn">START</button>
  </div>
  <div class="countin" id="countin" aria-live="polite"></div>
  <div class="edge" id="edge" aria-hidden="true"></div>
</main>

<!-- ============ Result ============ -->
<div class="scrim" id="doneScrim" hidden>
  <div class="sheet" role="dialog" aria-labelledby="doneH">
    <div class="lbl" id="doneH">READ COMPLETE</div>
    <div class="big" id="resPct">0%</div>
    <div class="resrow">
      <div><b id="resNotes">0/0</b><small>NOTES RIGHT</small></div>
      <div><b id="resTime">0%</b><small>ON THE PULSE</small></div>
      <div><b id="resWrong">0</b><small>WRONG KEYS</small></div>
    </div>
    <p id="afterMsg"></p>
    <div class="row">
      <button class="pill wide" id="againBtn">READ IT AGAIN</button>
      <button class="go" id="nextBtn">NEXT READ</button>
    </div>
    <button class="link" id="homeBtn">BACK TO LEVELS</button>
  </div>
</div>

<script src="./generator.js?v=3"></script>
<script src="./app.js?v=3"></script>
</body>
</html>
